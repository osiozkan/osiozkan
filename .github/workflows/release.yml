name: release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            ext: .exe
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
          - os: macos-latest
            name: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev
      - run: cargo test --workspace
      - run: cargo build --release -p nsub-gui -p nsub-cli
      - name: Package
        shell: bash
        run: |
          mkdir dist
          cp target/release/nightsub${{ matrix.ext }} dist/
          cp target/release/nightsub-gui${{ matrix.ext }} dist/
          cp -r docs dist/docs
          cp THIRD_PARTY.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: nightsub-${{ matrix.name }}
          path: dist
