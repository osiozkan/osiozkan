name: Release
on:
  push:
    tags: ["v*"]
    # gece sürümü: commit iletisinde [nightly] geçen push'lar (ör. gece sonu sürüm commit'i)
    branches: ["**"]
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[nightly]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev
      - name: Derle
        run: cargo build --release -p osisub-cli -p osisub-gui
      - name: Paketle
        shell: bash
        run: |
          mkdir dist
          for b in osisub osisub-gui; do
            if [ -f target/release/$b.exe ]; then cp target/release/$b.exe dist/; else cp target/release/$b dist/; fi
          done
          cp -r docs dist/docs
          cp examples/demo.ass dist/
      - name: Windows için ffmpeg ekle (BtbN GPL derlemesi; lisans THIRD_PARTY.md)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ff.zip -d ff
          mkdir -p dist/ffmpeg
          cp ff/*/bin/ffmpeg.exe ff/*/bin/ffprobe.exe dist/ffmpeg/
          cp ff/*/bin/ffplay.exe dist/ffmpeg/ 2>/dev/null || true
          cp ff/*/LICENSE.txt dist/ffmpeg/ 2>/dev/null || true
      - name: Windows için Tesseract OCR ekle (UB Mannheim derlemesi + eng/tur/jpn verisi; Apache-2.0)
        if: runner.os == 'Windows'
        # başarısız olursa paket Tesseract'sız yine üretilir (sistemde kurulu olan kullanılır)
        continue-on-error: true
        shell: bash
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest | grep -o '"browser_download_url": *"[^"]*w64-setup[^"]*\.exe"' | head -1 | sed 's/.*"\(http[^"]*\)"/\1/')
          echo "kurulum: $url"
          curl -fsSL -o tess-setup.exe "$url"
          7z x -y -otess tess-setup.exe > /dev/null
          mkdir -p dist/tesseract
          cp -r tess/* dist/tesseract/
          rm -rf dist/tesseract/\$PLUGINSDIR dist/tesseract/*uninstall* 2>/dev/null || true
          mkdir -p dist/tesseract/tessdata
          for l in eng tur jpn osd; do
            [ -s dist/tesseract/tessdata/$l.traineddata ] || curl -fsSL -o dist/tesseract/tessdata/$l.traineddata "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$l.traineddata"
          done
          if dist/tesseract/tesseract.exe --version | head -1 && dist/tesseract/tesseract.exe --list-langs; then echo "tesseract TAMAM"; else echo "tesseract YOK"; rm -rf dist/tesseract; fi
      - name: macOS için ffmpeg ekle (ffmpeg-static / ffprobe-static GPL derlemeleri; lisans THIRD_PARTY.md)
        if: runner.os == 'macOS'
        # indirme başarısız olursa paket ffmpeg'siz yine üretilir (sistemdeki ffmpeg kullanılır)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p dist/ffmpeg
          arch=$(uname -m); [ "$arch" = "arm64" ] || arch=x64
          curl -fsSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-darwin-$arch.gz" | gunzip > dist/ffmpeg/ffmpeg || rm -f dist/ffmpeg/ffmpeg
          (cd "$RUNNER_TEMP" && npm install --no-save --no-audit --no-fund ffprobe-static@3.1.0 >/dev/null 2>&1) && cp "$RUNNER_TEMP/node_modules/ffprobe-static/bin/darwin/$arch/ffprobe" dist/ffmpeg/ 2>/dev/null
          chmod +x dist/ffmpeg/* 2>/dev/null
          for t in ffmpeg ffprobe; do
            if [ -s dist/ffmpeg/$t ] && dist/ffmpeg/$t -hide_banner -version | head -1; then echo "$t TAMAM"; else echo "$t YOK"; rm -f dist/ffmpeg/$t; fi
          done
          rmdir dist/ffmpeg 2>/dev/null
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: osisub-${{ matrix.name }}-${{ github.sha }}
          retention-days: 30
          path: dist
