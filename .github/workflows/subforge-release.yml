name: subforge-release
on:
  push:
    tags: ["subforge-v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            ext: ""
          - os: windows-latest
            target: windows-x86_64
            ext: ".exe"
          - os: macos-latest
            target: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: subforge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: subforge
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libgtk-3-dev
      - run: cargo build --release -p subforge-cli -p subforge-gui
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/subforge-${{ matrix.target }}
          cp target/release/subforge${{ matrix.ext }} target/release/subforge-gui${{ matrix.ext }} dist/subforge-${{ matrix.target }}/
          cp README.md ROADMAP.md CHANGELOG.md dist/subforge-${{ matrix.target }}/
          cd dist && tar czf subforge-${{ matrix.target }}.tar.gz subforge-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: subforge-${{ matrix.target }}
          path: subforge/dist/*.tar.gz
