name: osisub
on:
  push:
    paths: ["osisub/**", ".github/workflows/osisub.yml"]
  pull_request:
    paths: ["osisub/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: osisub } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
