[project]
name = "kitsune-sub"
version = "0.1.0"
description = "Aegisub-uyumlu, Subtitle Edit'ten esinlenen anime altyazı editörü"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "lupa>=2.0", "numpy"]
[project.optional-dependencies]
dev = ["pytest"]
[project.scripts]
kitsune = "kitsune.cli:main"
[tool.setuptools.packages.find]
include = ["kitsune*"]
[tool.setuptools.package-data]
kitsune = ["lua/*.lua"]
