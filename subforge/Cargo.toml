[package]
name = "subforge"
version = "0.1.0"
edition = "2024"
description = "Anime subtitle authoring toolkit: Aegisub-compatible ASS core, Lua automation, Subtitle Edit style tools"

[lib]
name = "subforge"
path = "src/lib.rs"

[[bin]]
name = "subforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chardetng = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
fancy-regex = "0.19.2"
mlua = { version = "0.12", features = ["luajit", "vendored"] }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
ttf-parser = "0.25.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
