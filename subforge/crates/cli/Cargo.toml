[package]
name = "subforge-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "subforge"
path = "src/main.rs"

[dependencies]
subforge-core = { path = "../core" }
subforge-lua = { path = "../lua" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
