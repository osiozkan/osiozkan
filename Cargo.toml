[workspace]
resolver = "2"
members = ["crates/nsub-core", "crates/nsub-lua", "crates/nsub-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
regex = "1"
encoding_rs = "0.8"
chardetng = "0.1"
mlua = { version = "0.12", features = ["luajit", "vendored"] }
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
